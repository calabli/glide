<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Glide</title>
<style>
  :root{
    --bg:#ffffff;--fg:#1d1d1f;--sub:#86868b;--line:rgba(0,0,0,.08);--field:#f2f2f4;
    --accent:#0a84ff;--knob:#fff;--track:#d9d9de;
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#2c2d32;--fg:#f2f3f5;--sub:#9a9ba2;--line:rgba(255,255,255,.10);--field:#37383e;--track:#4a4b52}
  }
  :root{color-scheme:light dark}
  *{box-sizing:border-box;margin:0}
  body{width:300px;background:var(--bg);color:var(--fg);
    font:13px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei UI","Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased}
  header{display:flex;align-items:center;gap:10px;padding:14px 18px 8px}
  header img{width:22px;height:22px}
  header .t{font-weight:600;font-size:14px}
  header .h{color:var(--sub);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
  section{padding:4px 18px 10px;border-top:.5px solid var(--line)}
  section:first-of-type{border-top:0}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0}
  .row .l{display:flex;flex-direction:column}
  .note{color:var(--sub);font-size:11.5px;margin-top:1px}
  .note a{color:var(--accent);cursor:pointer;text-decoration:none}
  .note a:hover{text-decoration:underline}
  .label{color:var(--sub);font-size:11.5px;margin:8px 0 7px;letter-spacing:.02em}

  /* 分段选择 */
  .seg{display:flex;background:var(--field);border-radius:8px;padding:2px;flex:none}
  .seg button{all:unset;box-sizing:border-box;padding:4px 9px;border-radius:6px;font-size:12px;color:var(--sub);cursor:pointer;
    transition:background .2s,color .2s,box-shadow .2s;position:relative}
  .seg button:hover{color:var(--fg)}
  .seg button[aria-checked="true"]{background:var(--bg);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.15),0 0 0 .5px var(--line)}
  .seg button:focus-visible{outline:2px solid var(--accent)}
  /* 按钮位置：小屏幕示意图 */
  .seg.pos button{width:30px;height:24px;padding:0}
  .seg.pos button::before{content:"";position:absolute;inset:5px 6px;border-radius:3px;border:1px solid currentColor;opacity:.55}
  .seg.pos .dot{position:absolute;width:4px;height:7px;border-radius:2px;background:currentColor;margin:3px 4px}
  .seg.pos button[aria-checked="true"] .dot{background:var(--accent)}

  /* 定时 */
  .times{display:none;align-items:center;gap:6px;padding:2px 0 6px;flex-wrap:wrap}
  .times.show{display:flex}
  .times label{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:12px}
  .times input{font:inherit;font-size:13px;color:var(--fg);background:var(--field);border:0;border-radius:7px;padding:4px 6px;
    font-variant-numeric:tabular-nums;outline:none}
  .times input:focus-visible{box-shadow:0 0 0 2px var(--accent)}
  .times .dash{color:var(--sub)}
  .times .overnight{margin:0 0 0 2px}
  .mode-note{padding:0 0 4px}

  /* 开关 */
  .sw{position:relative;width:36px;height:22px;flex:none}
  .sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
  .sw span{position:absolute;inset:0;border-radius:11px;background:var(--track);transition:background .25s}
  .sw span::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
    background:var(--knob);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
  .sw input:checked + span{background:var(--accent)}
  .sw input:checked + span::after{transform:translateX(14px)}
  .sw input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
  .sw input:disabled{cursor:default}
  .sw input:disabled + span{opacity:.4}

  /* 底色 */
  .swatches{display:flex;gap:10px}
  .swatch{all:unset;cursor:pointer;width:30px;height:30px;border-radius:50%;position:relative;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),0 0 0 1px var(--line);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
  .swatch:hover{transform:scale(1.08)}
  .swatch::after{content:"";position:absolute;inset:-4px;border-radius:50%;box-shadow:0 0 0 2px var(--accent);
    opacity:0;transform:scale(.85);transition:opacity .2s,transform .3s cubic-bezier(.2,.8,.2,1)}
  .swatch[aria-checked="true"]::after{opacity:1;transform:none}
  .swatch:focus-visible{outline:2px solid var(--accent);outline-offset:6px}
  .preview{margin-top:10px;border-radius:9px;padding:7px 11px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 0 0 1px var(--line);transition:background .3s,color .3s}
  .preview b{font-size:12.5px;margin-right:4px}
  .text-row{margin-top:10px}
  .inline-label{color:var(--sub);font-size:11.5px;width:28px;flex:none}

  /* 滑块 */
  .slider{display:flex;align-items:center;gap:10px}
  .slider svg{width:14px;height:14px;flex:none;stroke:var(--sub);fill:none;stroke-width:1.8;stroke-linecap:round}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:2px;background:var(--track);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;
    box-shadow:0 1px 4px rgba(0,0,0,.3),0 0 0 .5px rgba(0,0,0,.1);cursor:pointer}

  /* 阅读模式按钮 */
  .btn{all:unset;box-sizing:border-box;width:100%;margin-top:6px;display:flex;align-items:center;justify-content:space-between;
    padding:10px 12px;border-radius:10px;background:var(--field);cursor:pointer;transition:filter .2s}
  .btn:hover{filter:brightness(.97)}
  .btn:active{transform:scale(.99)}
  .btn:focus-visible{outline:2px solid var(--accent)}
  .btn .k{color:var(--sub);font-size:11.5px}
  .btn[disabled]{opacity:.45;pointer-events:none}
  .tune{padding:6px 0 10px}
  .tune-head{display:flex;justify-content:space-between;margin-bottom:8px}
  .tune-val{color:var(--sub);font-size:12px;font-variant-numeric:tabular-nums;cursor:pointer}
  .tune-val:hover{color:var(--accent)}
  .unsupported{display:none;color:var(--sub);font-size:12px;padding:0 0 4px}
  body.na .site{opacity:.45;pointer-events:none}
  body.na .unsupported{display:block}
</style>
</head>
<body>
  <header>
    <img src="icons/48.png" alt="">
    <div>
      <div class="t">Glide</div>
      <div class="h" id="host">—</div>
    </div>
  </header>

  <section>
    <p class="unsupported">此页面不支持（浏览器内置页面或扩展商店）。</p>
    <div class="row site">
      <div class="l">
        <span>本网站夜间模式</span>
        <span class="note" id="siteNote">跟随系统</span>
      </div>
      <label class="sw"><input type="checkbox" id="siteDark"><span></span></label>
    </div>
    <div class="row site">
      <div class="l">
        <span>本网站不自动开启</span>
        <span class="note">反色效果不理想的网站，自动开启时跳过</span>
      </div>
      <label class="sw"><input type="checkbox" id="never"><span></span></label>
    </div>
    <div class="site tune">
      <div class="tune-head"><span>本网站夜间亮度</span><span class="tune-val" id="brightVal">100%</span></div>
      <div class="slider">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/></svg>
        <input type="range" id="bright" min="60" max="140" step="5" aria-label="本网站夜间亮度">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>
      </div>
    </div>
  </section>

  <section>
    <div class="row">
      <span>自动开启</span>
      <div class="seg" id="mode" role="radiogroup" aria-label="自动开启夜间模式">
        <button role="radio" data-mode="system">跟随系统</button>
        <button role="radio" data-mode="schedule">定时</button>
        <button role="radio" data-mode="off">关闭</button>
      </div>
    </div>
    <div class="times" id="times">
      <label>从 <input type="time" id="from" required></label>
      <span class="dash">—</span>
      <label>到 <input type="time" id="to" required></label>
      <span class="note overnight" id="overnight"></span>
    </div>
    <p class="note mode-note" id="modeNote"></p>
  </section>

  <section>
    <p class="label">夜间底色</p>
    <div class="swatches" id="swatches" role="radiogroup" aria-label="夜间底色"></div>
    <div class="slider text-row">
      <span class="inline-label">文字</span>
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/></svg>
      <input type="range" id="text" min="60" max="100" step="1" aria-label="文字亮度">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>
    </div>
    <div class="preview" id="preview"><b>预览</b> 正文文字在夜间模式下的样子</div>
  </section>

  <section>
    <div class="row">
      <span>按钮位置</span>
      <div class="seg pos" id="pos" role="radiogroup" aria-label="按钮位置">
        <button role="radio" data-pos="bl" title="左下"><i class="dot" style="left:3px;bottom:3px"></i></button>
        <button role="radio" data-pos="lm" title="左侧中间"><i class="dot" style="left:3px;top:5px"></i></button>
        <button role="radio" data-pos="rm" title="右侧中间"><i class="dot" style="right:3px;top:5px"></i></button>
        <button role="radio" data-pos="br" title="右下"><i class="dot" style="right:3px;bottom:3px"></i></button>
      </div>
    </div>
    <button class="btn site" id="reader"><span id="readerLabel">进入阅读模式</span><span class="k">⌥⇧R</span></button>
  </section>

  <script src="popup.js"></script>
</body>
</html>
